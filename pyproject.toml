[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartographer-cli"
version = "0.2.0"
description = "A map of how you build with coding agents: records sessions from Claude Code, Codex CLI and Cursor, maps them, and replays the build."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cartographer = "cartographer.cli:main"

[tool.setuptools]
packages = ["cartographer", "cartographer.adapters"]
