# Pings IndexNow (Bing and friends) with every URL in the sitemap after a push
# to main. The two minute wait lets the Cloudflare deploy finish first, so the
# crawler fetches the new pages rather than the old ones.
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'site/www/**.html'
      - 'site/www/sitemap.xml'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the deploy to finish
        run: sleep 120
      - name: Submit the sitemap URLs
        run: node scripts/indexnow.mjs
