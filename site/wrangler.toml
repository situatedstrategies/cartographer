# The public site as a Cloudflare Worker that only serves static files (Workers Static Assets).
# Workers Builds settings for this project: root directory `site`, build command `sh build.sh`,
# deploy command `npx wrangler deploy`. `name` must match the Worker's name in the dashboard.
# Kept to the same three keys wrangler generates on its own when no config exists; everything
# else (html handling, 404s, workers.dev) is the default.
name = "cartographer"
compatibility_date = "2026-09-01"

[assets]
directory = "www"
